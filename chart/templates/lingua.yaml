{{- $ns := include "assistant.namespace" . }}
---
kind: ConfigMap
apiVersion: v1
metadata:
  namespace: {{ $ns }}
  name: lingua-detector-app
  labels:
    app: lingua-detector
data:
  app.py: |
{{ .Files.Get "files/lingua-app.py" | indent 4 }}
---
kind: Deployment
apiVersion: apps/v1
metadata:
  namespace: {{ $ns }}
  name: lingua-detector
  labels:
    app: lingua-detector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lingua-detector
  template:
    metadata:
      labels:
        app: lingua-detector
    spec:
      containers:
        - resources:
            limits:
              cpu: '2'
              memory: 3Gi
            requests:
              cpu: '1'
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 5
            timeoutSeconds: 1
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 3
          terminationMessagePath: /dev/termination-log
          name: lingua-detector
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 10
            timeoutSeconds: 1
            periodSeconds: 30
            successThreshold: 1
            failureThreshold: 3
          env:
            - name: LOG_LEVEL
              value: INFO
            - name: TARGET_LANGUAGE
              value: {{ include "assistant.targetLanguage" . | quote }}
          volumeMounts:
            - name: lingua-app
              mountPath: /app/app.py
              subPath: app.py
              readOnly: true
          ports:
            - containerPort: 8080
              protocol: TCP
          imagePullPolicy: Always
          terminationMessagePolicy: File
          image: 'quay.io/ckavili/lingua-language-detector:0.0.26'
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      volumes:
        - name: lingua-app
          configMap:
            name: lingua-detector-app
            defaultMode: 0444
      dnsPolicy: ClusterFirst
      securityContext: {}
      schedulerName: default-scheduler
      topologySpreadConstraints:
        - maxSkew: 2
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: lingua-detector
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600
---
kind: Service
apiVersion: v1
metadata:
  namespace: {{ $ns }}
  name: lingua-detector
  labels:
    app: lingua-detector
spec:
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  internalTrafficPolicy: Cluster
  type: ClusterIP
  sessionAffinity: None
  selector:
    app: lingua-detector
