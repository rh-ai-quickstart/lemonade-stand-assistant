---
# LLM configuration
model: {}
  # name: my-model
  # endpoint: my-maas-instance
  # port: 443
  # api_key: my-api-key

# Detector configuration
# Configure GPU usage and resources for each detector
detectors:
  # IBM HAP Detector (Granite Guardian)
  hap:
    useGpu: false
    resources:
      requests:
        cpu: '1'
        memory: 4Gi
      limits:
        cpu: '2'
        memory: 8Gi

  # Prompt Injection Detector (DeBERTa v3)
  promptInjection:
    useGpu: false
    resources:
      requests:
        cpu: '4'
        memory: 16Gi
      limits:
        cpu: '8'
        memory: 24Gi

# Enable openshift dashboard
metrics:
  dashboard:
    enabled: false # requires cluster-admin privileges to install the dashboard
    odc: false

# Shiny Dashboard configuration
shinyDashboard:
  image:
    repository: quay.io/sara_banderby/shinydashboard
    tag: fedora
    pullPolicy: Always
  replicas: 1
  service:
    port: 3838
    targetPort: 3838
  route:
    enabled: true
    host: ""  # Leave empty for auto-generated hostname
  metrics:
    url: "http://lemonade-stand:8080/metrics"
    refreshInterval: 1
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"
