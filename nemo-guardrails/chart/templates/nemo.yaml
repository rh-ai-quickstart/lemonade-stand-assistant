---
apiVersion: trustyai.opendatahub.io/v1alpha1
kind: NemoGuardrails
metadata:
  name: lemonade
spec:
  nemoConfigs:
    - name: lemonade-stand
      default: true
      configMaps:
        - lemonade-config
  env:
    - name: LLM_API_BASE
      valueFrom:
        secretKeyRef:
          name: lemonade-secret
          key: api-base
    - name: LLM_MODEL_NAME
      valueFrom:
        secretKeyRef:
          name: lemonade-secret
          key: model-name
    - name: LLM_API_KEY
      valueFrom:
        secretKeyRef:
          name: lemonade-secret
          key: api-key